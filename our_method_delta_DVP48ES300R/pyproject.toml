[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plc-evidence-loop"
version = "0.1.0"
description = "Evidence-guided bounded synthesis harness for IEC Structured Text"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
plc-evidence-loop = "plc_loop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
