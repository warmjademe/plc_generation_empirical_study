[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plc-generation-service"
version = "0.1.0"
description = "Web deployment of the evidence-guided IEC 61131-3 ST generation loop"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.3.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "psycopg[binary]==3.2.9",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[project.scripts]
plc-generation-web = "plc_deploy.main:run"
plc-generation-worker = "plc_deploy.worker:run"
plc-evidence-loop = "plc_loop.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
